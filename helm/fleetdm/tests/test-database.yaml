apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fleetdm.fullname" . }}-test-database"
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: test-database
    image: mysql:8.0.36
    command:
    - /bin/sh
    - -c
    - |
      echo "Testing database connectivity and initialization..."
      
      # Wait for MySQL to be ready
      echo "Waiting for MySQL to be ready..."
      until mysqladmin ping -h {{ include "fleetdm.mysql.fullname" . }} -u {{ .Values.mysql.env.MYSQL_USER }} -p{{ .Values.mysql.env.MYSQL_PASSWORD }} --silent; do
        echo "MySQL not ready, waiting..."
        sleep 5
      done
      
      echo "MySQL is ready, testing database..."
      
      # Test database connection
      mysql -h {{ include "fleetdm.mysql.fullname" . }} -u {{ .Values.mysql.env.MYSQL_USER }} -p{{ .Values.mysql.env.MYSQL_PASSWORD }} -e "SELECT 1" {{ .Values.mysql.env.MYSQL_DATABASE }}
      if [ $? -eq 0 ]; then
        echo "✅ Database connection successful"
      else
        echo "❌ Database connection failed"
        exit 1
      fi
      
      # Check if FleetDM tables exist (database was initialized)
      TABLE_COUNT=$(mysql -h {{ include "fleetdm.mysql.fullname" . }} -u {{ .Values.mysql.env.MYSQL_USER }} -p{{ .Values.mysql.env.MYSQL_PASSWORD }} -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ .Values.mysql.env.MYSQL_DATABASE }}';" -s -N {{ .Values.mysql.env.MYSQL_DATABASE }})
      
      if [ "$TABLE_COUNT" -gt 0 ]; then
        echo "✅ Database tables found ($TABLE_COUNT tables) - database was properly initialized"
      else
        echo "❌ No tables found - database initialization may have failed"
        exit 1
      fi
      
      echo "🎉 Database tests passed!"
