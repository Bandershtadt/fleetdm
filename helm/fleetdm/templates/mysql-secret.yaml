{{- if .Values.mysql.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleetdm.mysql.fullname" . }}
  labels:
    {{- include "fleetdm.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
data:
  mysql-root-password: {{ .Values.mysql.env.MYSQL_ROOT_PASSWORD | b64enc | quote }}
  mysql-password: {{ .Values.mysql.env.MYSQL_PASSWORD | b64enc | quote }}
  mysql-user: {{ .Values.mysql.env.MYSQL_USER | b64enc | quote }}
  mysql-database: {{ .Values.mysql.env.MYSQL_DATABASE | b64enc | quote }}
{{- end }}

