kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fleetdm-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "ingress-ready=true"
    extraPortMappings:
    - containerPort: 30080
      hostPort: 8080
      protocol: TCP
      listenAddress: "0.0.0.0"
  - role: worker
  - role: worker
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

