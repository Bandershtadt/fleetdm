name: Release Chart

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'ci/**'
    paths:
      - 'helm/fleetdm/**'
  pull_request:
    paths:
      - 'helm/fleetdm/**'
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Lint chart
        run: helm lint helm/fleetdm

      - name: Template chart
        run: helm template test helm/fleetdm > /tmp/manifests.yaml

      - name: Set up Kind
        uses: helm/kind-action@v1.12.0

      - name: Test install
        run: |
          helm install fleetdm helm/fleetdm --wait --timeout 5m \
            --set mysql.persistence.enabled=false \
            --set redis.persistence.enabled=false
          kubectl get pods

      - name: Run Helm tests
        run: helm test fleetdm --timeout 5m

      - name: Test uninstall
        run: helm uninstall fleetdm

  release:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Get version
        id: version
        run: echo "VERSION=$(grep '^version:' helm/fleetdm/Chart.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Package chart
        run: |
          mkdir -p dist
          helm package helm/fleetdm -d dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v$VERSION"
          
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          
          gh release create "$TAG" \
            --title "v$VERSION" \
            --notes "FleetDM Helm Chart v$VERSION" \
            dist/*.tgz
