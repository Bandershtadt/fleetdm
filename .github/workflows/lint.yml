name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install yamllint
      run: |
        pip install yamllint

    - name: Run yamllint
      run: |
        yamllint -c .yamllint .

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: "3.12.0"

    - name: Lint Helm chart
      run: |
        helm lint ./fleet
        helm template fleet ./fleet --debug

    - name: Validate chart dependencies
      run: |
        helm dependency update ./fleet
        helm dependency list ./fleet

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install markdownlint
      run: |
        npm install -g markdownlint-cli

    - name: Run markdownlint
      run: |
        markdownlint README.md
