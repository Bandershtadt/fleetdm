name: Lint

on:
  pull_request:
    paths:
      - 'helm/**'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - main
    paths:
      - 'helm/**'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Lint Helm Chart
        run: |
          helm lint helm/fleetdm

      - name: Template Helm Chart
        run: |
          helm template fleetdm helm/fleetdm > /tmp/manifests.yaml
          echo "Generated Kubernetes manifests:"
          wc -l /tmp/manifests.yaml

