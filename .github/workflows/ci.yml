name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  HELM_VERSION: "3.12.0"
  KIND_VERSION: "v0.20.0"

jobs:
  lint:
    name: Lint Helm Chart
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Lint Helm chart
      run: |
        helm lint ./fleet
        helm template fleet ./fleet --debug

    - name: Validate chart dependencies
      run: |
        helm dependency update ./fleet
        helm dependency list ./fleet

  test:
    name: Test Deployment
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Kind
      uses: helm/kind-action@v1
      with:
        cluster_name: fleetdm-test
        config: config/kind-config.yaml

    - name: Install NGINX Ingress
      run: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=90s

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Deploy FleetDM
      run: |
        kubectl create namespace fleetdm --dry-run=client -o yaml | kubectl apply -f -
        helm dependency update ./fleet
        helm upgrade --install fleetdm ./fleet \
          --namespace fleetdm \
          --wait \
          --timeout=10m

    - name: Verify Deployment
      run: |
        kubectl wait --for=condition=ready pod -l app=fleet -n fleetdm --timeout=300s
        kubectl get pods -n fleetdm
        kubectl get services -n fleetdm
        kubectl get ingress -n fleetdm

    - name: Test Health Endpoint
      run: |
        kubectl port-forward -n fleetdm svc/fleetdm-service 8080:8080 &
        PF_PID=$!
        sleep 10
        curl -f http://localhost:8080/healthz || exit 1
        kill $PF_PID

    - name: Cleanup
      if: always()
      run: |
        kind delete cluster --name fleetdm-test || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Package Helm Chart
      run: |
        helm package ./fleet
        helm repo index . --url https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: FleetDM Helm Chart v${{ github.run_number }}
        files: |
          fleet-*.tgz
          index.yaml
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Chart Version
      run: |
        # Update Chart.yaml version
        sed -i "s/^version: .*/version: v${{ github.run_number }}/" ./fleet/Chart.yaml
        git add ./fleet/Chart.yaml
        git commit -m "Bump chart version to v${{ github.run_number }}" || exit 0
        git push